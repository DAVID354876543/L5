<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        body {
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
        }
        .topnav {
            overflow: hidden;
            background-color: #333;
        }
        .topnav a {
            float: left;
            color: #1affa3;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }
        .topnav a:hover {
            background-color: #ddd;
            color: black;
        }
        .topnav a.active {
            background-color: #ffe066;
            color: black;
        }
    </style>

</head>
<body>
    <div class="topnav">
        <a href="active" href="#home">Home</a>
        <a href="about">About</a>
        <a href="contact">Contact Us</a>
    </div><br>
    <span class="border trans" style="font-size:40px;">
        <center>Welcome to this Website</center>
    </span><br>
    <section>
        <h2>Chinese cuisine</h2>
        <p>Chinese cuisine is an important part of Chinese culture.</p>
    </section>

</html>
